<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasificador de Aves - Leyva</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Clasificador <span class="highlight">IA</span></h1>
        <p class="subtitle">Desarrollado por Leyva</p>
        <p style="color: #c5c6c7; font-size: 14px; margin-bottom: 25px; border: 1px dashed #00f3ff; padding: 10px; border-radius: 8px;">
            <strong>Especies compatibles:</strong> Sube una imagen de un 
            <span style="color: #00ff88;">Gallito de las Rocas</span> o un 
            <span style="color: #00ff88;">Pingüino de Humboldt</span> para realizar la prueba.
        </p>
        
        <p id="status" class="loading">Iniciando motor neuronal...</p>

        <div class="input-wrapper">
            <input type="file" id="file-input" accept="image/*" onchange="previewAndPredict()" disabled />
        </div>

        <br>
        <img id="preview" src="" alt="Vista previa de la imagen">

        <div id="prediction-result" class="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
